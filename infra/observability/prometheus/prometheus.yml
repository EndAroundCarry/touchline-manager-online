# Prometheus for the local telemetry stack (master plan §14.1, §16 Stage 14; `F-48`).
#
# The application exposes no scrape endpoint of its own — it only exports OTLP — so the OTLP collector is
# the single scrape target, and every series Prometheus holds arrives through it. Prometheus and
# Alertmanager are also scraped for their own `up`, which is what makes a dead collector visible.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: touchline-observability

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
