<div
  class="flex items-baseline justify-between gap-1 border-b border-slate-100 py-0.5 last:border-b-0 sm:gap-3 sm:py-1"
>
  <span class="min-w-0 break-words text-[0.5625rem] leading-tight text-slate-600 sm:text-sm">
    {{ label() }}
  </span>
  <span [class]="valueClass()" aria-hidden="true">{{ value() }}</span>
  <span class="sr-only">{{ value() }}, {{ band().label }}</span>
</div>
