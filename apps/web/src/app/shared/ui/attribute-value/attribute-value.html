<div [class]="tileClass()" [attr.title]="label() + ': ' + value() + ' (' + band().label + ')'">
  <span
    class="text-[0.625rem] font-medium uppercase tracking-tight text-slate-500"
    aria-hidden="true"
  >
    {{ visibleLabel() }}
  </span>
  <span class="mt-0.5 text-sm font-semibold tabular-nums" aria-hidden="true">{{ value() }}</span>
  <span class="sr-only">{{ label() }} {{ value() }}, {{ band().label }}</span>
</div>
