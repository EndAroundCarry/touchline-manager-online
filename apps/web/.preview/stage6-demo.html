<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stage 6 renderer harness</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #090d16;
        color: #e2e8f0;
        font: 13px/1.5 system-ui, sans-serif;
        padding: 16px;
      }

      h1 {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 0 0 12px;
      }

      #pitch {
        display: block;
        width: 100%;
        max-width: 1120px;
        aspect-ratio: 105 / 68;
        border: 1px solid #1e293b;
        border-radius: 10px;
        background: #0b1220;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
      }

      button {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }

      #fps {
        font-weight: 700;
        color: #34d399;
      }

      #time {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <h1>Stage 6 renderer — synthetic goal passage</h1>
    <canvas id="pitch" role="img" aria-label="Synthetic goal passage"></canvas>
    <div class="bar">
      <button id="play" type="button">Play / pause</button>
      <button type="button" data-speed="1">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <button type="button" data-speed="8">8x</button>
      <span id="fps">-</span>
      <span id="time"></span>
    </div>
    <script src="./stage6-demo.js"></script>
  </body>
</html>
